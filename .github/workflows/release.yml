name: ShareFlow Production Release & Public APK Distribution

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag (leave empty to auto-read versionName from app/build.gradle.kts, e.g. v1.0.22)"
        required: false
        default: ""
        type: string
      release_notes_ar:
        description: "ملاحظات الإصدار بالعربية (اختياري — تُستخرج تلقائياً من Tag/Commits عند تركها فارغة)"
        required: false
        default: ""
      release_notes_en:
        description: "English release notes (optional — auto-extracted from tag/commits when empty)"
        required: false
        default: ""
      mandatory_update:
        description: "Mark this release as a mandatory update in version.json"
        required: false
        default: false
        type: boolean
      sync_public_website:
        description: "Update docs/version.json and GitHub Pages manifest in ow7ab/Share-Flow after release"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Safe test mode: validate, test, build & sign locally WITHOUT publishing a GitHub Release or updating docs/version.json"
        required: false
        default: false
        type: boolean

# Serialize production releases globally (prevents concurrent runs for the same version or racing docs/version.json updates).
# cancel-in-progress is false so an active release is never terminated mid-flight.
concurrency:
  group: shareflow-production-release
  cancel-in-progress: false

# Unified single-repository permissions on ow7ab/Share-Flow:
# uses GitHub's built-in GITHUB_TOKEN (contents: write) to publish Releases, tags, and docs/version.json directly.
permissions:
  contents: write

jobs:
  build-sign-and-publish-public-release:
    name: Build, Sign, Verify & Publish Share-Flow.apk to ow7ab/Share-Flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unified Share Flow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release trigger, signing secrets, and target repository
        id: validate_config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.EXPECTED_CERT_SHA256 }}
          SETUP_TOKEN: ${{ secrets.KEYSTORE_SETUP_TOKEN }}
          TARGET_REPO: ${{ vars.PUBLIC_RELEASES_REPO || github.repository }}
          PORTAL_URL: ${{ vars.SHAREFLOW_PORTAL_URL || 'https://ow7ab.github.io/Share-Flow/' }}
          SOURCE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          INPUT_TAG: ${{ github.event.inputs.release_tag || '' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          set -euo pipefail

          # Strip accidental leading/trailing whitespace or CR/LF
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
          export GH_TOKEN

          DRY_RUN="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN="true"
            echo "Running in SAFE DRY-RUN mode: no GitHub Release or website manifest changes will be published."
          fi

          # When triggered by a branch push to main (e.g. from Google AI Studio), cut a release
          # whenever the versionName in app/build.gradle.kts is not yet published in TARGET_REPO.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            if [ "$ACTOR" = "shareflow-release-bot" ] || printf '%s' "$HEAD_COMMIT_MSG" | grep -Eqi '\[skip (ci|release)\]'; then
              echo "Skipping automatic release for bot or [skip release] commit."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=Automated docs/bot commit ([skip release])" >> "$GITHUB_OUTPUT"
              echo "public_repo=${TARGET_REPO}" >> "$GITHUB_OUTPUT"
              echo "portal_url=${PORTAL_URL}" >> "$GITHUB_OUTPUT"
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            GRADLE_VER=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' ./app/build.gradle.kts | head -n 1)
            RELEASE_TAG="v${GRADLE_VER}"

            # Check case-insensitively if this version (vX.Y.Z or VX.Y.Z) is already published
            EXISTING_RELEASES_JSON="${RUNNER_TEMP}/existing-releases-check.json"
            if gh api "repos/${TARGET_REPO}/releases?per_page=100" > "$EXISTING_RELEASES_JSON" 2>/dev/null; then
              ALREADY_PUBLISHED=$(EXISTING_RELEASES_JSON="$EXISTING_RELEASES_JSON" RELEASE_TAG="$RELEASE_TAG" python3 - <<'PYEOF'
          import json, os
          target = os.environ["RELEASE_TAG"].lower()
          with open(os.environ["EXISTING_RELEASES_JSON"], "r", encoding="utf-8") as fh:
              releases = json.load(fh)
          exists = any(
              not r.get("draft", False) and str(r.get("tag_name") or "").strip().lower() == target
              for r in releases
          )
          print("true" if exists else "false")
          PYEOF
              )
              rm -f "$EXISTING_RELEASES_JSON"
              if [ "$ALREADY_PUBLISHED" = "true" ]; then
                echo "Release '${RELEASE_TAG}' (case-insensitive) is already published in '${TARGET_REPO}'; skipping automatic branch release."
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                echo "skip_reason=Release ${RELEASE_TAG} already published in ${TARGET_REPO}" >> "$GITHUB_OUTPUT"
                echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
                echo "public_repo=${TARGET_REPO}" >> "$GITHUB_OUTPUT"
                echo "portal_url=${PORTAL_URL}" >> "$GITHUB_OUTPUT"
                echo "dry_run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              rm -f "$EXISTING_RELEASES_JSON"
              # Fallback when GitHub API is transiently unavailable: only proceed if app/build.gradle.kts changed
              if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                if ! git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | grep -Fxq "app/build.gradle.kts"; then
                  echo "Could not query releases API and app/build.gradle.kts did not change; skipping automatic release."
                  echo "should_release=false" >> "$GITHUB_OUTPUT"
                  echo "skip_reason=No version bump in app/build.gradle.kts on main push" >> "$GITHUB_OUTPUT"
                  echo "public_repo=${TARGET_REPO}" >> "$GITHUB_OUTPUT"
                  echo "portal_url=${PORTAL_URL}" >> "$GITHUB_OUTPUT"
                  echo "dry_run=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
            echo "Detected unpublished version '${RELEASE_TAG}' in app/build.gradle.kts on main push — proceeding with automated release."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG=$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')
            if [ -z "$RELEASE_TAG" ]; then
              GRADLE_VER=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' ./app/build.gradle.kts | head -n 1)
              if [ -n "$GRADLE_VER" ]; then
                RELEASE_TAG="v${GRADLE_VER}"
                echo "Auto-detected release tag from app/build.gradle.kts: ${RELEASE_TAG}"
              fi
            fi
          else
            RELEASE_TAG="$REF_NAME"
          fi

          # Sanitize KEYSTORE_SETUP_TOKEN against mobile copy/paste whitespace, CR/LF, invisible RTL/zero-width Unicode marks, quotes, or Bearer/token prefix
          SETUP_TOKEN="$(RAW_TOKEN="${SETUP_TOKEN:-}" python3 - <<'SAN_PYEOF'
          import os, re
          s = os.environ.get("RAW_TOKEN", "")
          s = re.sub(r"[\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff\u00a0]", "", s)
          s = s.strip().strip("\"'“”‘’")
          s = re.sub(r"^(?:Bearer|token)\s+", "", s, flags=re.I)
          s = s.strip().strip("\"'“”‘’")
          s = re.sub(r"\s+", "", s)
          print(s, end="")
          SAN_PYEOF
          )"

          # Safe first-time keystore bootstrap is allowed ONLY when ALL signing secrets & cert pin are absent AND KEYSTORE_SETUP_TOKEN is provided.
          BOOTSTRAP_KEYSTORE="false"
          if [ -z "$KEYSTORE_B64" ] && [ -z "$STORE_PW" ] && [ -z "$KEY_PW" ] && [ -z "$EXPECTED_CERT" ] && [ -n "$SETUP_TOKEN" ]; then
            BOOTSTRAP_KEYSTORE="true"
            echo "First-time setup detected: permanent release signing secrets are absent and KEYSTORE_SETUP_TOKEN is configured. Validating KEYSTORE_SETUP_TOKEN before build..."

            SETUP_CHECK_ERR="${RUNNER_TEMP}/setup-token-check.err"
            rm -f "$SETUP_CHECK_ERR"
            if ! GH_TOKEN="$SETUP_TOKEN" gh api "repos/${SOURCE_REPO}/actions/secrets?per_page=100" >/dev/null 2>"$SETUP_CHECK_ERR"; then
              ERR_MSG=$(tr '\n' ' ' < "$SETUP_CHECK_ERR" | sed -E 's/[[:space:]]+/ /g')
              rm -f "$SETUP_CHECK_ERR"
              TOKEN_DIAG="$(CLEAN_TOKEN="$SETUP_TOKEN" python3 - <<'PYEOF'
          import os
          t = os.environ.get("CLEAN_TOKEN", "")
          if t.startswith("github_pat_"):
              fmt = "github_pat_ (Fine-grained PAT)"
          elif t.startswith("ghp_"):
              fmt = "ghp_ (Classic PAT)"
          elif t.startswith(("gho_", "ghu_", "ghs_", "ghr_")):
              fmt = "gh*_ (non-PAT token)"
          else:
              fmt = "UNRECOGNIZED (must start with github_pat_ or ghp_)"
          print(f"format={fmt}, length={len(t)}", end="")
          PYEOF
              )"
              {
                echo "## Action Required: Refresh \`KEYSTORE_SETUP_TOKEN\` (HTTP 401/403)"
                echo ""
                echo "First-time permanent Android release keystore bootstrap could not authenticate to \`${SOURCE_REPO}\` Actions Secrets."
                echo ""
                echo "- **Token diagnostic (non-sensitive):** \`${TOKEN_DIAG}\`"
                echo "- **GitHub API response:** \`${ERR_MSG}\`"
                echo ""
                echo "### Quick Fix (1 minute)"
                echo "1. Open **[Create Fine-grained Personal Access Token](https://github.com/settings/personal-access-tokens/new)**."
                echo "2. Under **Repository access**, choose **Only select repositories** → \`${SOURCE_REPO}\`."
                echo "3. Under **Repository permissions**, set **Secrets** to **Read and write** (Metadata: Read-only is auto-selected)."
                echo "4. Click **Generate token** and copy the full token (\`github_pat_...\`)."
                echo "5. Open **[Repository Secrets](https://github.com/${SOURCE_REPO}/settings/secrets/actions)** → edit \`KEYSTORE_SETUP_TOKEN\` → paste the new token → **Update secret**."
                echo "6. Click **Re-run all jobs** on this workflow. It will generate your permanent release keystore once, save all 5 signing secrets, delete \`KEYSTORE_SETUP_TOKEN\`, and publish \`${RELEASE_TAG}\` automatically."
              } >> "$GITHUB_STEP_SUMMARY"

              if printf '%s' "$ERR_MSG" | grep -Eqi '401|Bad credentials'; then
                echo "::error::KEYSTORE_SETUP_TOKEN was rejected by GitHub (HTTP 401: Bad credentials). Diagnostic: ${TOKEN_DIAG}. The saved token is expired, revoked, or not a valid GitHub PAT."
              elif printf '%s' "$ERR_MSG" | grep -Eqi '403|404|Resource not accessible'; then
                echo "::error::KEYSTORE_SETUP_TOKEN is valid (${TOKEN_DIAG}) but lacks permission 'Secrets: Read and write' on '${SOURCE_REPO}' (${ERR_MSG})."
              else
                echo "::error::KEYSTORE_SETUP_TOKEN failed validation (${TOKEN_DIAG}) against '${SOURCE_REPO}' Actions Secrets: ${ERR_MSG}"
              fi
              echo "::error::Update secret KEYSTORE_SETUP_TOKEN in https://github.com/${SOURCE_REPO}/settings/secrets/actions with a fresh Fine-grained PAT (Secrets: Read and write on ${SOURCE_REPO}), then click Re-run jobs."
              exit 1
            fi
            rm -f "$SETUP_CHECK_ERR"
            echo "Verified KEYSTORE_SETUP_TOKEN has Actions Secrets write access on '${SOURCE_REPO}'."
          fi

          MISSING=()
          if [ "$BOOTSTRAP_KEYSTORE" != "true" ]; then
            [ -z "$KEYSTORE_B64" ] && MISSING+=("Secret: ANDROID_KEYSTORE_BASE64")
            [ -z "$STORE_PW" ] && MISSING+=("Secret: ANDROID_STORE_PASSWORD")
            [ -z "$KEY_PW" ] && MISSING+=("Secret: ANDROID_KEY_PASSWORD")
          fi

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing required production release secrets in ${SOURCE_REPO} (Settings -> Secrets and variables -> Actions -> Repository secrets):"
            for item in "${MISSING[@]}"; do
              echo "::error::  - $item"
            done
            echo "::error::A replacement release signing keystore is NEVER generated automatically to preserve in-place Android upgrades. Add ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD (or temporary KEYSTORE_SETUP_TOKEN for first-time setup)."
            exit 1
          fi

          RESOLVED_ALIAS="${KEY_ALIAS_SECRET:-upload}"

          if ! printf '%s' "$TARGET_REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid target repository format: '$TARGET_REPO'. Expected owner/repo."
            exit 1
          fi

          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$RELEASE_TAG' must follow semantic versioning format vMAJOR.MINOR.PATCH (e.g. v1.0.22)."
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "public_repo=${TARGET_REPO}" >> "$GITHUB_OUTPUT"
          echo "portal_url=${PORTAL_URL}" >> "$GITHUB_OUTPUT"
          echo "key_alias=${RESOLVED_ALIAS}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "bootstrap_keystore=${BOOTSTRAP_KEYSTORE}" >> "$GITHUB_OUTPUT"

      - name: Locate Android Gradle project root and verify wrapper
        id: locate_project
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE=$(find . -maxdepth 4 \
            \( -name ".git" -o -name ".gradle" -o -name "build" \) -prune -o \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print | sort | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not locate settings.gradle or settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          if [ ! -f "$PROJECT_DIR/gradlew" ] || [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle Wrapper files are missing in $PROJECT_DIR."
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android application module (app/build.gradle.kts) was not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify unified public repository, non-duplicate tag, and pre-build versionCode/versionName
        id: prebuild_version_check
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: ${{ steps.validate_config.outputs.public_repo }}
          PORTAL_URL: ${{ steps.validate_config.outputs.portal_url }}
          RELEASE_TAG: ${{ steps.validate_config.outputs.release_tag }}
          DRY_RUN: ${{ steps.validate_config.outputs.dry_run }}
        run: |
          set -euo pipefail

          PREV_MANIFEST="${RUNNER_TEMP}/prev-published-version.json"
          rm -f "$PREV_MANIFEST"

          # Strip accidental leading/trailing whitespace or CR/LF
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
          export GH_TOKEN

          REPO_API_OUT="${RUNNER_TEMP}/public-repo-api.json"
          REPO_API_ERR="${RUNNER_TEMP}/public-repo-api.err"
          ALL_RELEASES_OUT="${RUNNER_TEMP}/public-repo-releases.json"
          rm -f "$REPO_API_OUT" "$REPO_API_ERR" "$ALL_RELEASES_OUT"

          if gh api "repos/${PUBLIC_REPO}" >"$REPO_API_OUT" 2>"$REPO_API_ERR"; then
            IS_PRIVATE=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(str(d.get("private", True)).lower())' "$REPO_API_OUT")
            if [ "$IS_PRIVATE" != "false" ]; then
              echo "::error::Destination repository '${PUBLIC_REPO}' is not public (private=${IS_PRIVATE}). Public APK distribution requires a public repository."
              exit 1
            fi

            # Case-insensitive duplicate release check (guards against both vX.Y.Z and legacy VX.Y.Z)
            gh api "repos/${PUBLIC_REPO}/releases?per_page=100" >"$ALL_RELEASES_OUT" 2>/dev/null || echo "[]" >"$ALL_RELEASES_OUT"
            DUP_TAG=$(ALL_RELEASES_OUT="$ALL_RELEASES_OUT" RELEASE_TAG="$RELEASE_TAG" python3 - <<'PYEOF'
          import json, os
          target = os.environ["RELEASE_TAG"].lower()
          with open(os.environ["ALL_RELEASES_OUT"], "r", encoding="utf-8") as fh:
              releases = json.load(fh)
          for r in releases:
              if not r.get("draft", False) and str(r.get("tag_name") or "").strip().lower() == target:
                  print(str(r.get("tag_name") or ""))
                  break
          PYEOF
            )
            if [ -n "$DUP_TAG" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "::warning::[DRY-RUN] Release '${DUP_TAG}' already exists in '${PUBLIC_REPO}'."
              else
                echo "::error::Release '${DUP_TAG}' already exists in '${PUBLIC_REPO}'. Existing production releases are never overwritten. Increment versionName and versionCode and push a new version."
                exit 1
              fi
            fi

            gh release download --repo "$PUBLIC_REPO" --pattern "version.json" --output "$PREV_MANIFEST" >/dev/null 2>&1 || true
          else
            ERR_MSG=$(tr '\n' ' ' < "$REPO_API_ERR" | sed -E 's/[[:space:]]+/ /g')
            if printf '%s' "$ERR_MSG" | grep -Eqi '401|Bad credentials'; then
              echo "::error::GitHub API token was rejected (HTTP 401: Bad credentials) while verifying '${PUBLIC_REPO}'."
            else
              echo "::error::Failed to verify destination repository '${PUBLIC_REPO}': ${ERR_MSG}"
            fi
            exit 1
          fi
          rm -f "$REPO_API_OUT" "$REPO_API_ERR" "$ALL_RELEASES_OUT"

          # Fallback to public HTTPS version.json on GitHub Pages if latest release did not carry version.json
          if [ ! -s "$PREV_MANIFEST" ]; then
            curl -fsSL --max-time 10 "${PORTAL_URL%/}/version.json" -o "$PREV_MANIFEST" >/dev/null 2>&1 || rm -f "$PREV_MANIFEST"
          fi

          PREBUILD_ARGS=(
            --gradle "./app/build.gradle.kts"
            --release-tag "$RELEASE_TAG"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -s "$PREV_MANIFEST" ]; then
            PREBUILD_ARGS+=(--prev-manifest "$PREV_MANIFEST")
            echo "prev_manifest_path=${PREV_MANIFEST}" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.validate_config.outputs.bootstrap_keystore }}" = "true" ]; then
              if grep -Eq '"signingCertSha256"[[:space:]]*:[[:space:]]*"[0-9a-fA-F]{64}"' "$PREV_MANIFEST"; then
                echo "::error::A prior signed production release already exists in '${PUBLIC_REPO}'. Refusing to bootstrap a replacement keystore because changing the signing certificate breaks in-place Android upgrades."
                exit 1
              fi
            fi
          else
            echo "prev_manifest_path=" >> "$GITHUB_OUTPUT"
          fi

          # Fail fast BEFORE running Gradle if applicationId, versionName, tag sync, or monotonic versionCode is invalid
          python3 ./scripts/release_helpers.py validate-prebuild "${PREBUILD_ARGS[@]}"

      - name: Set up JDK 21 (Temurin)
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle caching
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Decode and validate permanent release keystore outside tracked workspace (with guarded first-time bootstrap)
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ steps.validate_config.outputs.key_alias }}
          BOOTSTRAP_KEYSTORE: ${{ steps.validate_config.outputs.bootstrap_keystore }}
          GH_TOKEN: ${{ secrets.KEYSTORE_SETUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_FILE="${RUNNER_TEMP}/shareflow-release-key.jks"

          if [ "$BOOTSTRAP_KEYSTORE" = "true" ]; then
            # Sanitize KEYSTORE_SETUP_TOKEN against mobile copy/paste whitespace, CR/LF, invisible RTL/zero-width Unicode marks, quotes, or Bearer/token prefix
            GH_TOKEN="$(RAW_TOKEN="${GH_TOKEN:-}" python3 - <<'SAN_PYEOF'
          import os, re
          s = os.environ.get("RAW_TOKEN", "")
          s = re.sub(r"[\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff\u00a0]", "", s)
          s = s.strip().strip("\"'“”‘’")
          s = re.sub(r"^(?:Bearer|token)\s+", "", s, flags=re.I)
          s = s.strip().strip("\"'“”‘’")
          s = re.sub(r"\s+", "", s)
          print(s, end="")
          SAN_PYEOF
            )"
            export GH_TOKEN

            echo "Running guarded one-time permanent release keystore bootstrap for '${SOURCE_REPO}'..."
            if ! EXISTING_SECRETS=$(gh secret list --app actions --repo "$SOURCE_REPO" --json name --jq '.[].name' 2>&1); then
              echo "::error::KEYSTORE_SETUP_TOKEN failed to access Actions Secrets on '${SOURCE_REPO}': ${EXISTING_SECRETS}"
              echo "::error::Ensure KEYSTORE_SETUP_TOKEN is a non-expired Fine-grained PAT scoped to '${SOURCE_REPO}' with permission 'Secrets: Read and write' (and 'Metadata: Read-only')."
              exit 1
            fi

            for sec_name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD EXPECTED_CERT_SHA256; do
              if printf '%s\n' "$EXISTING_SECRETS" | grep -Fxq "$sec_name"; then
                echo "::error::Secret '${sec_name}' already exists in '${SOURCE_REPO}'. Refusing to overwrite existing release signing configuration."
                exit 1
              fi
            done

            BOOT_DIR="${RUNNER_TEMP}/shareflow-keystore-bootstrap"
            rm -rf "$BOOT_DIR"
            mkdir -p "$BOOT_DIR"
            chmod 700 "$BOOT_DIR"

            BOOT_JKS="${BOOT_DIR}/shareflow-release.jks"
            BOOT_B64="${BOOT_DIR}/shareflow-release.jks.b64"
            BOOT_VERIFY_JKS="${BOOT_DIR}/roundtrip-verify.jks"
            KEY_ALIAS="upload"

            BOOT_STORE_PW=$(python3 -c 'import secrets, string; a = string.ascii_letters + string.digits; print("".join(secrets.choice(a) for _ in range(32)), end="")')
            BOOT_KEY_PW=$(python3 -c 'import secrets, string; a = string.ascii_letters + string.digits; print("".join(secrets.choice(a) for _ in range(32)), end="")')
            echo "::add-mask::${BOOT_STORE_PW}"
            echo "::add-mask::${BOOT_KEY_PW}"
            export BOOT_STORE_PW BOOT_KEY_PW

            keytool -genkeypair -noprompt \
              -keystore "$BOOT_JKS" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Share Flow, O=Share Flow, C=SD" \
              -storepass:env BOOT_STORE_PW \
              -keypass:env BOOT_KEY_PW >/dev/null 2>&1
            chmod 600 "$BOOT_JKS"

            base64 -w 0 "$BOOT_JKS" > "$BOOT_B64"
            chmod 600 "$BOOT_B64"
            tr -d '\r\n' < "$BOOT_B64" | base64 --decode > "$BOOT_VERIFY_JKS"
            chmod 600 "$BOOT_VERIFY_JKS"

            KEYTOOL_OUT=$(keytool -list -v -keystore "$BOOT_VERIFY_JKS" -storepass:env BOOT_STORE_PW -alias "$KEY_ALIAS")
            if ! printf '%s\n' "$KEYTOOL_OUT" | grep -qi "Entry type: PrivateKeyEntry" || ! printf '%s\n' "$KEYTOOL_OUT" | grep -Eqi "2048-bit RSA"; then
              echo "::error::Bootstrapped keystore failed keytool PrivateKeyEntry / 2048-bit RSA verification."
              exit 1
            fi

            BOOT_CERT_SHA256=$(printf '%s\n' "$KEYTOOL_OUT" \
              | awk -F'SHA256: ' '/SHA256:/ {gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')
            if [ -z "$BOOT_CERT_SHA256" ] || [ "${#BOOT_CERT_SHA256}" -ne 64 ]; then
              echo "::error::Failed to extract 64-char SHA-256 fingerprint from bootstrapped keystore."
              exit 1
            fi

            gh secret set ANDROID_KEYSTORE_BASE64 --app actions --repo "$SOURCE_REPO" < "$BOOT_B64"
            printf '%s' "$BOOT_STORE_PW" | gh secret set ANDROID_STORE_PASSWORD --app actions --repo "$SOURCE_REPO"
            printf '%s' "$BOOT_KEY_PW" | gh secret set ANDROID_KEY_PASSWORD --app actions --repo "$SOURCE_REPO"
            printf '%s' "$KEY_ALIAS" | gh secret set ANDROID_KEY_ALIAS --app actions --repo "$SOURCE_REPO"
            printf '%s' "$BOOT_CERT_SHA256" | gh secret set EXPECTED_CERT_SHA256 --app actions --repo "$SOURCE_REPO"

            VERIFIED_SECRETS=$(gh secret list --app actions --repo "$SOURCE_REPO" --json name --jq '.[].name')
            for sec_name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS EXPECTED_CERT_SHA256; do
              if ! printf '%s\n' "$VERIFIED_SECRETS" | grep -Fxq "$sec_name"; then
                echo "::error::Failed to verify saved Repository Secret '${sec_name}' in '${SOURCE_REPO}'."
                exit 1
              fi
            done

            gh secret delete KEYSTORE_SETUP_TOKEN --app actions --repo "$SOURCE_REPO" >/dev/null 2>&1 || true

            cp -f "$BOOT_VERIFY_JKS" "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "BOOTSTRAPPED_STORE_PASSWORD=$BOOT_STORE_PW" >> "$GITHUB_ENV"
            echo "BOOTSTRAPPED_KEY_PASSWORD=$BOOT_KEY_PW" >> "$GITHUB_ENV"
            echo "BOOTSTRAPPED_EXPECTED_CERT=$BOOT_CERT_SHA256" >> "$GITHUB_ENV"
            echo "GRADLE_ALIAS_INIT_SCRIPT=" >> "$GITHUB_ENV"
            echo "One-time permanent keystore generated, verified, and saved to Repository Secrets in '${SOURCE_REPO}' (cert SHA-256: ${BOOT_CERT_SHA256})."
          else
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"

            KEYSTORE_INFO=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass:env STORE_PW -alias "$KEY_ALIAS_SECRET")
            if ! printf '%s\n' "$KEYSTORE_INFO" | grep -qi "PrivateKeyEntry"; then
              echo "::error::Keystore alias '${KEY_ALIAS_SECRET}' is not a valid PrivateKeyEntry."
              exit 1
            fi
            echo "Verified permanent release signing keystore and PrivateKeyEntry alias (${KEY_ALIAS_SECRET})."
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

            if [ "$KEY_ALIAS_SECRET" != "upload" ]; then
              INIT_SCRIPT="${RUNNER_TEMP}/release-alias.init.gradle"
              cat > "$INIT_SCRIPT" << 'EOF'
          gradle.beforeProject { proj ->
              proj.plugins.withId("com.android.application") {
                  def components = proj.extensions.findByName("androidComponents")
                  if (components != null) {
                      components.finalizeDsl { ext ->
                          def relSigning = ext.signingConfigs.findByName("release")
                          def aliasFromEnv = System.getenv("ANDROID_KEY_ALIAS")
                          if (relSigning != null && aliasFromEnv != null && !aliasFromEnv.trim().isEmpty()) {
                              relSigning.keyAlias = aliasFromEnv.trim()
                          }
                      }
                  }
              }
          }
          EOF
              echo "GRADLE_ALIAS_INIT_SCRIPT=$INIT_SCRIPT" >> "$GITHUB_ENV"
            else
              echo "GRADLE_ALIAS_INIT_SCRIPT=" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run download portal, release pipeline, and unified website safety tests
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          node --test ./scripts/test-portal.js
          if [ -f "./scripts/test-release-workflow.js" ]; then
            node --test ./scripts/test-release-workflow.js
          fi
          bash ./scripts/sync-public-docs.sh --dry-run

      - name: Run full Android unit and Robolectric test suite
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -s "./debug.keystore" ]; then
            if [ -n "$DEBUG_KEYSTORE_B64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "./debug.keystore"
            elif [ -s "./debug.keystore.base64" ]; then
              tr -d '\r\n' < "./debug.keystore.base64" | base64 --decode > "./debug.keystore"
            else
              # Test-only debug keystore for :app:testDebugUnitTest (never used for Release APK signing)
              keytool -genkeypair -v \
                -keystore "./debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            fi
            chmod 600 "./debug.keystore"
          fi
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build signed Release APK and Play App Bundle (AAB)
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || env.BOOTSTRAPPED_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || env.BOOTSTRAPPED_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.validate_config.outputs.key_alias }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${GRADLE_ALIAS_INIT_SCRIPT:-}" ] && [ -f "${GRADLE_ALIAS_INIT_SCRIPT}" ]; then
            EXTRA_ARGS+=(--init-script "${GRADLE_ALIAS_INIT_SCRIPT}")
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease "${EXTRA_ARGS[@]}" --stacktrace --no-daemon

      - name: Verify APK signature, certificate pin, alignment, version sync, and generate version.json
        id: verify_outputs
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 || env.BOOTSTRAPPED_EXPECTED_CERT }}
          PUBLIC_REPO: ${{ steps.validate_config.outputs.public_repo }}
          RELEASE_TAG: ${{ steps.validate_config.outputs.release_tag }}
          PORTAL_URL: ${{ steps.validate_config.outputs.portal_url }}
          PREV_MANIFEST: ${{ steps.prebuild_version_check.outputs.prev_manifest_path }}
          GRADLE_VERSION_CODE: ${{ steps.prebuild_version_check.outputs.gradle_version_code }}
          GRADLE_VERSION_NAME: ${{ steps.prebuild_version_check.outputs.gradle_version_name }}
          INPUT_NOTES_AR: ${{ github.event.inputs.release_notes_ar || '' }}
          INPUT_NOTES_EN: ${{ github.event.inputs.release_notes_en || '' }}
          INPUT_MANDATORY: ${{ github.event.inputs.mandatory_update || false }}
        run: |
          set -euo pipefail

          RELEASE_APK="./app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$RELEASE_APK" ]; then
            RELEASE_APK=$(find ./app/build/outputs/apk/release -maxdepth 2 -name "*.apk" -type f | sort | head -n 1 || true)
          fi
          RELEASE_AAB=$(find ./app/build/outputs/bundle/release -maxdepth 2 -name "*.aab" -type f | sort | head -n 1 || true)
          MAPPING_TXT=$(find ./app/build/outputs/mapping/release -maxdepth 2 -name "mapping.txt" -type f | sort | head -n 1 || true)

          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Signed Release APK was not produced under app/build/outputs/apk/release."
            exit 1
          fi
          if [ -z "$RELEASE_AAB" ] || [ ! -s "$RELEASE_AAB" ]; then
            echo "::error::Signed Release AAB was not produced under app/build/outputs/bundle/release."
            exit 1
          fi

          STAGE_DIR="${RUNNER_TEMP}/shareflow-release-stage"
          mkdir -p "$STAGE_DIR"
          FIXED_APK="${STAGE_DIR}/Share-Flow.apk"
          cp -f "$RELEASE_APK" "$FIXED_APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          # 1. Verify APK cryptographic signature and pinned signing certificate
          SIGNER_OUT=$("$APKSIGNER" verify --verbose --print-certs "$FIXED_APK")
          echo "$SIGNER_OUT"

          CERT_SHA256=$(printf '%s\n' "$SIGNER_OUT" \
            | grep -Ei '^(Signer #[0-9]+|V[0-9.]+ Signer:)[[:space:]]+certificate SHA-256 digest:' \
            | head -n 1 \
            | sed -E 's/.*digest:[[:space:]]*//' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]:' || true)
          EXPECTED_NORM=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')
          if [ -z "$CERT_SHA256" ] || [ "${#CERT_SHA256}" -ne 64 ]; then
            echo "::error::Failed to extract valid 64-char signing certificate SHA-256 from Share-Flow.apk."
            exit 1
          fi
          if [ -n "$EXPECTED_NORM" ]; then
            if [ "$CERT_SHA256" != "$EXPECTED_NORM" ]; then
              echo "::error::Signing certificate SHA-256 mismatch! Expected ${EXPECTED_NORM}, got ${CERT_SHA256}. Aborting release to protect existing user installations and upgrade compatibility."
              exit 1
            fi
            echo "Verified APK signing certificate matches EXPECTED_CERT_SHA256 (${CERT_SHA256})."
          else
            echo "::warning::Secret EXPECTED_CERT_SHA256 is not configured yet. Add '${CERT_SHA256}' as secret EXPECTED_CERT_SHA256 to pin this signing certificate permanently."
          fi

          # 2. Verify 4-byte zipalign alignment (Android 11+ installability)
          "$ZIPALIGN" -c -v 4 "$FIXED_APK" >/dev/null
          echo "Verified Share-Flow.apk zipalign 4-byte alignment."

          # 3. Verify package identity, version sync with release tag, and launchable activity
          BADGING=$("$AAPT2" dump badging "$FIXED_APK")
          PKG_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          MIN_SDK=$(printf '%s\n' "$BADGING" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" | head -n 1)
          HAS_LAUNCHER=$(printf '%s\n' "$BADGING" | grep -c "^launchable-activity:" || true)

          if [ "$PKG_NAME" != "com.shareflow" ]; then
            echo "::error::Unexpected package name '$PKG_NAME'. Expected 'com.shareflow'."
            exit 1
          fi
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ] || [ "$HAS_LAUNCHER" -lt 1 ]; then
            echo "::error::APK badging validation failed (versionCode=$VERSION_CODE, versionName=$VERSION_NAME, launcher=$HAS_LAUNCHER)."
            exit 1
          fi
          if [ "v${VERSION_NAME}" != "$RELEASE_TAG" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match app versionName 'v${VERSION_NAME}' in app/build.gradle.kts. Keep versionName synchronized with the release tag."
            exit 1
          fi

          # 4. Verify AAB signature
          AAB_ABS=$(realpath "$RELEASE_AAB")
          jarsigner -verify -strict "$AAB_ABS" >/dev/null

          # 5. Double-check built APK versionCode/versionName parity with Gradle, monotonic increase, & signing cert continuity
          POSTBUILD_ARGS=(
            --version-code "$VERSION_CODE"
            --cert-sha256 "$CERT_SHA256"
            --expected-version-code "$GRADLE_VERSION_CODE"
            --version-name "$VERSION_NAME"
            --expected-version-name "$GRADLE_VERSION_NAME"
          )
          if [ -n "${PREV_MANIFEST:-}" ] && [ -s "$PREV_MANIFEST" ]; then
            POSTBUILD_ARGS+=(--prev-manifest "$PREV_MANIFEST")
          fi
          python3 ./scripts/release_helpers.py verify-postbuild "${POSTBUILD_ARGS[@]}"

          # 6. Compute SHA-256 and exact byte size
          APK_SHA256=$(sha256sum "$FIXED_APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$FIXED_APK")
          printf '%s  Share-Flow.apk\n' "$APK_SHA256" > "${STAGE_DIR}/Share-Flow.apk.sha256"

          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DIRECT_APK_URL="https://github.com/${PUBLIC_REPO}/releases/download/${RELEASE_TAG}/Share-Flow.apk"
          LATEST_APK_URL="https://github.com/${PUBLIC_REPO}/releases/latest/download/Share-Flow.apk"
          MANIFEST_PATH="${STAGE_DIR}/version.json"

          # 7. Generate unified version.json (with auto-extracted tag/commit release notes if manual notes are blank)
          MANIFEST_ARGS=(
            --version-code "$VERSION_CODE"
            --version-name "$VERSION_NAME"
            --apk-url "$LATEST_APK_URL"
            --apk-download-url "$DIRECT_APK_URL"
            --sha256 "$APK_SHA256"
            --file-size "$APK_SIZE"
            --min-sdk "${MIN_SDK:-24}"
            --published-at "$PUBLISHED_AT"
            --release-tag "$RELEASE_TAG"
            --cert-sha256 "$CERT_SHA256"
            --portal-url "$PORTAL_URL"
            --notes-ar "$INPUT_NOTES_AR"
            --notes-en "$INPUT_NOTES_EN"
            --repo-dir "."
            --output "$MANIFEST_PATH"
          )
          if [ "$INPUT_MANDATORY" = "true" ]; then
            MANIFEST_ARGS+=(--mandatory)
          fi
          python3 ./scripts/release_helpers.py build-manifest "${MANIFEST_ARGS[@]}"

          # 8. Cross-verify generated version.json directly with the website parser (docs/app.js)
          MANIFEST_PATH="$MANIFEST_PATH" node -e '
            const fs = require("node:fs");
            const assert = require("node:assert/strict");
            const portal = require("./docs/app.js");
            const raw = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, "utf8"));
            const parsed = portal.normalizeCustomManifest(raw);
            assert.equal(parsed.status, "ready", "Website parser rejected generated version.json!");
            assert.equal(parsed.data.sha256, raw.sha256);
            assert.equal(parsed.data.buildNumber, raw.versionCode);
            console.log("Verified version.json compatibility with docs/app.js:", parsed.data.versionLabel);
          '

          echo "apk_path=${FIXED_APK}" >> "$GITHUB_OUTPUT"
          echo "sha_path=${STAGE_DIR}/Share-Flow.apk.sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_path=${MANIFEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "aab_path=${AAB_ABS}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "direct_apk_url=${DIRECT_APK_URL}" >> "$GITHUB_OUTPUT"
          echo "latest_apk_url=${LATEST_APK_URL}" >> "$GITHUB_OUTPUT"
          if [ -n "$MAPPING_TXT" ]; then
            echo "mapping_path=$(realpath "$MAPPING_TXT")" >> "$GITHUB_OUTPUT"
          fi

      - name: Atomically publish verified Share-Flow.apk to ow7ab/Share-Flow (Draft -> Verify -> Promote)
        id: publish_public_release
        if: ${{ steps.validate_config.outputs.should_release == 'true' && steps.validate_config.outputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: ${{ steps.validate_config.outputs.public_repo }}
          RELEASE_TAG: ${{ steps.validate_config.outputs.release_tag }}
          VERSION_NAME: ${{ steps.verify_outputs.outputs.version_name }}
          VERSION_CODE: ${{ steps.verify_outputs.outputs.version_code }}
          APK_SHA256: ${{ steps.verify_outputs.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.verify_outputs.outputs.apk_size }}
          CERT_SHA256: ${{ steps.verify_outputs.outputs.cert_sha256 }}
          PUBLISHED_AT: ${{ steps.verify_outputs.outputs.published_at }}
          APK_PATH: ${{ steps.verify_outputs.outputs.apk_path }}
          SHA_PATH: ${{ steps.verify_outputs.outputs.sha_path }}
          MANIFEST_PATH: ${{ steps.verify_outputs.outputs.manifest_path }}
        run: |
          set -euo pipefail

          # Strip accidental leading/trailing whitespace or CR/LF
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
          export GH_TOKEN

          # Final race-condition duplicate guard before creating draft release
          if gh api "repos/${PUBLIC_REPO}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release '${RELEASE_TAG}' already exists in '${PUBLIC_REPO}'. Aborting to preserve immutable release history."
            exit 1
          fi

          SIZE_MB=$(APK_SIZE="$APK_SIZE" python3 -c "import os; print(f'{int(os.environ[\"APK_SIZE\"]) / (1024 * 1024):.2f} MB')")
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          MANIFEST_PATH="$MANIFEST_PATH" \
          PUBLIC_REPO="$PUBLIC_REPO" \
          RELEASE_TAG="$RELEASE_TAG" \
          VERSION_NAME="$VERSION_NAME" \
          VERSION_CODE="$VERSION_CODE" \
          SIZE_MB="$SIZE_MB" \
          APK_SIZE="$APK_SIZE" \
          PUBLISHED_AT="$PUBLISHED_AT" \
          APK_SHA256="$APK_SHA256" \
          CERT_SHA256="$CERT_SHA256" \
          NOTES_FILE="$NOTES_FILE" \
          python3 - <<'PYEOF'
          import json, os

          with open(os.environ["MANIFEST_PATH"], "r", encoding="utf-8") as f:
              manifest = json.load(f)

          notes_ar = str(manifest.get("releaseNotesAr", "")).strip()
          notes_en = str(manifest.get("releaseNotesEn", "")).strip()
          bullets = "\n".join(f"- {item}" for item in manifest.get("releaseNotes", []) if str(item).strip())

          body = f"""## Share Flow v{os.environ['VERSION_NAME']} (Build {os.environ['VERSION_CODE']})

          ### Direct Android APK Download (No ZIP)
          - **Latest Direct APK:** https://github.com/{os.environ['PUBLIC_REPO']}/releases/latest/download/Share-Flow.apk
          - **This Release APK:** https://github.com/{os.environ['PUBLIC_REPO']}/releases/download/{os.environ['RELEASE_TAG']}/Share-Flow.apk
          - **File Size:** {os.environ['SIZE_MB']} ({os.environ['APK_SIZE']} bytes)
          - **Published (UTC):** {os.environ['PUBLISHED_AT']}
          - **APK SHA-256:** `{os.environ['APK_SHA256']}`
          - **Signing Certificate SHA-256:** `{os.environ['CERT_SHA256']}`

          ### Changelog / سجل التغييرات
          {bullets}
          """
          if notes_en and notes_en != notes_ar:
              body += f"\n**English Notes:**\n{notes_en}\n"

          body += (
              f"\n> Built and cryptographically signed from the official Share Flow repository (`{os.environ['PUBLIC_REPO']}`). "
              "Verified automatically via `apksigner`, `zipalign`, `aapt2`, and unit tests prior to publication.\n"
          )

          with open(os.environ["NOTES_FILE"], "w", encoding="utf-8") as out:
              out.write(body)
          PYEOF

          # Atomic rollback guard: if draft upload or asset verification fails before promotion, delete the incomplete draft
          DRAFT_CREATED="false"
          cleanup_failed_draft() {
            if [ "$DRAFT_CREATED" = "true" ]; then
              echo "::warning::Rolling back incomplete draft release '${RELEASE_TAG}' in '${PUBLIC_REPO}' so no partial release is exposed."
              gh release delete "$RELEASE_TAG" --repo "$PUBLIC_REPO" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_failed_draft ERR

          # Step 1: Create DRAFT release and upload all three verified artifacts
          gh release create "$RELEASE_TAG" \
            "$APK_PATH#Share-Flow.apk" \
            "$SHA_PATH#Share-Flow.apk.sha256" \
            "$MANIFEST_PATH#version.json" \
            --repo "$PUBLIC_REPO" \
            --target "${GITHUB_SHA}" \
            --title "Share Flow v${VERSION_NAME} (Build ${VERSION_CODE})" \
            --notes-file "$NOTES_FILE" \
            --draft
          DRAFT_CREATED="true"

          # Step 2: Verify every asset on the DRAFT release BEFORE making it public
          DRAFT_JSON=$(gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" --json tagName,url,assets,isDraft)
          DRAFT_JSON="$DRAFT_JSON" EXPECTED_SIZE="$APK_SIZE" python3 - <<'PYEOF'
          import json, os
          data = json.loads(os.environ["DRAFT_JSON"])
          assets = {a["name"]: a for a in data.get("assets", [])}
          assert "Share-Flow.apk" in assets, "Share-Flow.apk asset missing from draft release!"
          assert "Share-Flow.apk.sha256" in assets, "Share-Flow.apk.sha256 missing from draft release!"
          assert "version.json" in assets, "version.json asset missing from draft release!"
          assert not any(name.lower().endswith(".zip") for name in assets), "ZIP archive must never be published!"
          assert assets["Share-Flow.apk"]["size"] == int(os.environ["EXPECTED_SIZE"]), "Uploaded APK size mismatch!"
          print("Verified all 3 assets on draft release prior to promotion.")
          PYEOF

          # Step 3: Promote verified draft atomically to public Latest Release
          gh release edit "$RELEASE_TAG" \
            --repo "$PUBLIC_REPO" \
            --draft=false \
            --latest
          DRAFT_CREATED="false"
          trap - ERR

          RELEASE_URL=$(gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" --json url --jq '.url')
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          echo "Promoted verified public GitHub Release: ${RELEASE_URL}"

      - name: Verify unauthenticated public direct APK download
        if: ${{ steps.validate_config.outputs.should_release == 'true' && steps.validate_config.outputs.dry_run != 'true' }}
        shell: bash
        env:
          PUBLIC_REPO: ${{ steps.validate_config.outputs.public_repo }}
          EXPECTED_SIZE: ${{ steps.verify_outputs.outputs.apk_size }}
        run: |
          set -euo pipefail

          # Unauthenticated public download probe (zero tokens passed to curl) with brief CDN propagation retry
          LATEST_APK_URL="https://github.com/${PUBLIC_REPO}/releases/latest/download/Share-Flow.apk"
          VERIFIED="false"
          for attempt in 1 2 3; do
            if HEADERS=$(curl -fsSLI --max-redirs 5 "$LATEST_APK_URL" 2>/dev/null); then
              CONTENT_TYPE=$(printf '%s\n' "$HEADERS" | grep -i "^content-type:" | tail -n 1 | tr '[:upper:]' '[:lower:]')
              CONTENT_LEN=$(printf '%s\n' "$HEADERS" | grep -i "^content-length:" | tail -n 1 | awk '{print $2}' | tr -d '\r')
              if ! printf '%s' "$CONTENT_TYPE" | grep -q "text/html"; then
                if [ -z "$CONTENT_LEN" ] || [ "$CONTENT_LEN" = "$EXPECTED_SIZE" ]; then
                  echo "Verified unauthenticated public direct APK download (${CONTENT_LEN:-unknown} bytes): ${LATEST_APK_URL}"
                  VERIFIED="true"
                  break
                fi
              fi
            fi
            echo "Attempt ${attempt}/3 waiting for GitHub Releases edge propagation..."
            sleep 5
          done

          if [ "$VERIFIED" != "true" ]; then
            echo "::error::Public direct APK probe failed or returned invalid size/content-type for ${LATEST_APK_URL}."
            exit 1
          fi

      - name: Update docs/version.json in unified repository (GitHub Pages)
        id: sync_website
        if: ${{ steps.validate_config.outputs.should_release == 'true' && steps.validate_config.outputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.sync_public_website != false) }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          LATEST_MANIFEST_FILE: ${{ steps.verify_outputs.outputs.manifest_path }}
          TARGET_BRANCH: main
          SYNC_COMMIT_REASON: "Release ${{ steps.validate_config.outputs.release_tag }} (Build ${{ steps.verify_outputs.outputs.version_code }}): update docs/version.json"
        run: |
          set -euo pipefail
          bash ./scripts/sync-public-docs.sh --local-update

      - name: Restore FCM release notification dedupe cache
        if: ${{ steps.validate_config.outputs.should_release == 'true' && steps.validate_config.outputs.dry_run != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/shareflow-fcm-dedupe
          key: shareflow-fcm-notified-${{ steps.validate_config.outputs.release_tag }}

      - name: Send instant FCM update notification to Share Flow users (non-fatal)
        id: fcm_notify
        continue-on-error: true
        if: ${{ steps.validate_config.outputs.should_release == 'true' && steps.validate_config.outputs.dry_run != 'true' }}
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MANIFEST_PATH: ${{ steps.verify_outputs.outputs.manifest_path }}
          RELEASE_TAG: ${{ steps.validate_config.outputs.release_tag }}
          VERSION_NAME: ${{ steps.verify_outputs.outputs.version_name }}
          VERSION_CODE: ${{ steps.verify_outputs.outputs.version_code }}
          APK_URL: ${{ steps.verify_outputs.outputs.direct_apk_url }}
          APK_SHA256: ${{ steps.verify_outputs.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.verify_outputs.outputs.apk_size }}
          PUBLISHED_AT: ${{ steps.verify_outputs.outputs.published_at }}
          DEDUPE_MARKER: ${{ runner.temp }}/shareflow-fcm-dedupe/notified.json
        run: |
          set -euo pipefail
          node ./scripts/send-fcm-release-notification.mjs \
            --manifest-json "$MANIFEST_PATH" \
            --release-tag "$RELEASE_TAG" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --apk-url "$APK_URL" \
            --sha256 "$APK_SHA256" \
            --file-size "$APK_SIZE" \
            --published-at "$PUBLISHED_AT" \
            --dedupe-marker-file "$DEDUPE_MARKER"

      - name: Upload Release APK workflow artifact
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shareflow-release-apk
          path: ${{ steps.verify_outputs.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB workflow artifact
        if: ${{ steps.validate_config.outputs.should_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shareflow-release-aab
          path: ${{ steps.verify_outputs.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 ProGuard mapping file
        if: ${{ steps.validate_config.outputs.should_release == 'true' && steps.verify_outputs.outputs.mapping_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: shareflow-release-r8-mapping
          path: ${{ steps.verify_outputs.outputs.mapping_path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Write final release deployment summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SHOULD_RELEASE: ${{ steps.validate_config.outputs.should_release || 'false' }}
          SKIP_REASON: ${{ steps.validate_config.outputs.skip_reason || '' }}
          DRY_RUN: ${{ steps.validate_config.outputs.dry_run || 'false' }}
          RELEASE_TAG: ${{ steps.validate_config.outputs.release_tag || github.ref_name }}
          PUBLIC_REPO: ${{ steps.validate_config.outputs.public_repo || github.repository }}
          PORTAL_URL: ${{ steps.validate_config.outputs.portal_url || 'https://ow7ab.github.io/Share-Flow/' }}
          VERSION_NAME: ${{ steps.verify_outputs.outputs.version_name || steps.prebuild_version_check.outputs.gradle_version_name || 'N/A' }}
          VERSION_CODE: ${{ steps.verify_outputs.outputs.version_code || steps.prebuild_version_check.outputs.gradle_version_code || 'N/A' }}
          APK_SHA256: ${{ steps.verify_outputs.outputs.apk_sha256 || 'Not generated' }}
          APK_SIZE: ${{ steps.verify_outputs.outputs.apk_size || '0' }}
          CERT_SHA256: ${{ steps.verify_outputs.outputs.cert_sha256 || 'Not verified' }}
          RELEASE_URL: ${{ steps.publish_public_release.outputs.release_url || '' }}
          DIRECT_APK_URL: ${{ steps.verify_outputs.outputs.direct_apk_url || '' }}
          LATEST_APK_URL: ${{ steps.verify_outputs.outputs.latest_apk_url || '' }}
          WEBSITE_OUTCOME: ${{ steps.sync_website.outcome || 'skipped' }}
          FCM_OUTCOME: ${{ steps.fcm_notify.outcome || 'skipped' }}
        run: |
          {
            echo "## Share Flow Automated Release Summary"
            echo ""
            if [ "$SHOULD_RELEASE" != "true" ] && [ "$JOB_STATUS" = "success" ]; then
              echo "> **SKIPPED (NO NEW RELEASE REQUIRED)** — ${SKIP_REASON:-No version bump detected}."
            elif [ "$DRY_RUN" = "true" ] && [ "$JOB_STATUS" = "success" ]; then
              echo "> **SAFE DRY-RUN SUCCEEDED** — Build, signing, verification, and \`version.json\` validation all passed. No GitHub Release or website update was published."
            elif [ "$JOB_STATUS" = "success" ]; then
              echo "> **PRODUCTION RELEASE PUBLISHED SUCCESSFULLY**"
            else
              echo "> **RELEASE PIPELINE FAILED (${JOB_STATUS})** — Atomic guards prevented incomplete public release or website updates."
            fi
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Version** | \`v${VERSION_NAME}\` (Build \`${VERSION_CODE}\`) |"
            echo "| **Release Tag** | \`${RELEASE_TAG}\` |"
            echo "| **Application ID** | \`com.shareflow\` |"
            echo "| **Unified Primary Repo** | \`${PUBLIC_REPO}\` |"
            echo "| **Official Website** | ${PORTAL_URL} |"
            echo "| **Update Manifest (\`version.json\`)** | ${PORTAL_URL%/}/version.json |"
            if [ -n "$LATEST_APK_URL" ]; then
              echo "| **Latest Direct APK** | ${LATEST_APK_URL} |"
            fi
            if [ -n "$DIRECT_APK_URL" ]; then
              echo "| **Versioned Direct APK** | ${DIRECT_APK_URL} |"
            fi
            if [ -n "$RELEASE_URL" ]; then
              echo "| **GitHub Release** | ${RELEASE_URL} |"
            fi
            echo "| **Website & Manifest Update** | \`${WEBSITE_OUTCOME}\` |"
            echo "| **FCM Push Notification** | \`${FCM_OUTCOME}\` |"
            echo "| **APK Size (bytes)** | \`${APK_SIZE}\` |"
            echo "| **APK SHA-256** | \`${APK_SHA256}\` |"
            echo "| **Signing Cert SHA-256** | \`${CERT_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Securely delete ephemeral keystore and staging files
        if: always()
        shell: bash
        run: |
          for sensitive_file in \
            "${RUNNER_TEMP}/shareflow-release-key.jks" \
            "${RUNNER_TEMP}/release-alias.init.gradle" \
            "${RUNNER_TEMP}/debug-test-fallback.init.gradle" \
            "${RUNNER_TEMP}/release-notes.md" \
            "${RUNNER_TEMP}/prev-published-version.json"; do
            if [ -f "$sensitive_file" ]; then
              if command -v shred >/dev/null 2>&1; then
                shred -u "$sensitive_file" 2>/dev/null || rm -f "$sensitive_file"
              else
                rm -f "$sensitive_file"
              fi
            fi
          done
          if [ -d "${RUNNER_TEMP}/shareflow-keystore-bootstrap" ]; then
            if command -v shred >/dev/null 2>&1; then
              find "${RUNNER_TEMP}/shareflow-keystore-bootstrap" -type f -exec shred -u {} + 2>/dev/null || true
            fi
            rm -rf "${RUNNER_TEMP}/shareflow-keystore-bootstrap"
          fi
          rm -rf "${RUNNER_TEMP}/shareflow-release-stage"
          rm -rf "${RUNNER_TEMP}/shareflow-public-docs-sync"
          if [ -n "${{ steps.locate_project.outputs.project_dir }}" ]; then
            rm -f "${{ steps.locate_project.outputs.project_dir }}/debug.keystore"
          fi
