name: ShareFlow Automated Release Build & APK Publish

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_notes_ar:
        description: "ملاحظات الإصدار بالعربية (اختياري)"
        required: false
        default: ""
      release_notes_en:
        description: "English release notes (optional)"
        required: false
        default: ""

concurrency:
  group: shareflow-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Test, Build, Sign, Verify & Publish Share-Flow.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required release signing secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Missing required GitHub Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, and ANDROID_KEY_PASSWORD. Configure the project's permanent release signing keystore in Repository Settings > Secrets and variables > Actions. A new keystore is never generated automatically to preserve upgrade compatibility."
            exit 1
          fi

      - name: Locate Android Gradle project root and verify wrapper
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE=$(find . -maxdepth 4 \
            \( -name ".git" -o -name ".gradle" -o -name "build" \) -prune -o \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print | sort | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not locate settings.gradle or settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          if [ ! -f "$PROJECT_DIR/gradlew" ] || [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle Wrapper files are missing in $PROJECT_DIR."
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android application module (app/build.gradle.kts) was not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Decode and validate permanent release keystore in runner temp
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${RUNNER_TEMP}/shareflow-release-key.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          TARGET_ALIAS="${KEY_ALIAS_SECRET:-upload}"
          KEYSTORE_INFO=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass:env STORE_PW -alias "$TARGET_ALIAS")
          if ! printf '%s\n' "$KEYSTORE_INFO" | grep -qi "PrivateKeyEntry"; then
            echo "::error::Keystore alias '${TARGET_ALIAS}' is not a valid PrivateKeyEntry."
            exit 1
          fi
          echo "Verified permanent signing keystore and PrivateKeyEntry alias integrity."
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          if [ -n "$KEY_ALIAS_SECRET" ] && [ "$KEY_ALIAS_SECRET" != "upload" ]; then
            INIT_SCRIPT="${RUNNER_TEMP}/release-alias.init.gradle"
            cat > "$INIT_SCRIPT" << 'EOF'
            gradle.beforeProject { proj ->
                proj.plugins.withId("com.android.application") {
                    def components = proj.extensions.findByName("androidComponents")
                    if (components != null) {
                        components.finalizeDsl { ext ->
                            def relSigning = ext.signingConfigs.findByName("release")
                            def aliasFromEnv = System.getenv("ANDROID_KEY_ALIAS")
                            if (relSigning != null && aliasFromEnv != null && !aliasFromEnv.trim().isEmpty()) {
                                relSigning.keyAlias = aliasFromEnv.trim()
                            }
                        }
                    }
                }
            }
            EOF
            echo "GRADLE_ALIAS_INIT_SCRIPT=$INIT_SCRIPT" >> "$GITHUB_ENV"
          else
            echo "GRADLE_ALIAS_INIT_SCRIPT=" >> "$GITHUB_ENV"
          fi

      - name: Run download portal automated verification tests
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [ -f "./scripts/test-portal.js" ]; then
            node --test ./scripts/test-portal.js
          fi

      - name: Run full unit and Robolectric test suite before building release
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          DEBUG_INIT="${RUNNER_TEMP}/debug-test-fallback.init.gradle"
          cat > "$DEBUG_INIT" << 'EOF'
          gradle.beforeProject { proj ->
              proj.plugins.withId("com.android.application") {
                  def components = proj.extensions.findByName("androidComponents")
                  if (components != null) {
                      components.finalizeDsl { ext ->
                          def defaultDebugSigning = ext.signingConfigs.findByName("debug")
                          def debugBuildType = ext.buildTypes.findByName("debug")
                          if (defaultDebugSigning != null && debugBuildType != null) {
                              def currentStoreFile = debugBuildType.signingConfig?.storeFile
                              if (currentStoreFile == null || !currentStoreFile.exists()) {
                                  debugBuildType.signingConfig = defaultDebugSigning
                              }
                          }
                      }
                  }
              }
          }
          EOF
          ./gradlew :app:testDebugUnitTest --init-script "$DEBUG_INIT" --stacktrace --no-daemon

      - name: Build signed Release APK and Play App Bundle (AAB)
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${GRADLE_ALIAS_INIT_SCRIPT:-}" ] && [ -f "${GRADLE_ALIAS_INIT_SCRIPT}" ]; then
            EXTRA_ARGS+=(--init-script "${GRADLE_ALIAS_INIT_SCRIPT}")
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease "${EXTRA_ARGS[@]}" --stacktrace --no-daemon

      - name: Stage Share-Flow.apk, verify signature, alignment, package identity, anti-downgrade, and generate manifest
        id: verify_outputs
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
          TARGET_REPO: ${{ vars.PUBLIC_RELEASES_REPO || github.repository }}
          PORTAL_URL: ${{ vars.SHAREFLOW_PORTAL_URL || 'https://ow7ab.github.io/Share-Flow/' }}
          INPUT_NOTES_AR: ${{ github.event.inputs.release_notes_ar || '' }}
          INPUT_NOTES_EN: ${{ github.event.inputs.release_notes_en || '' }}
        run: |
          set -euo pipefail

          RELEASE_APK=$(find ./app/build/outputs/apk/release -maxdepth 2 -name "*.apk" -type f | sort | head -n 1)
          RELEASE_AAB=$(find ./app/build/outputs/bundle/release -maxdepth 2 -name "*.aab" -type f | sort | head -n 1)
          MAPPING_TXT=$(find ./app/build/outputs/mapping/release -maxdepth 2 -name "mapping.txt" -type f | sort | head -n 1 || true)

          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Signed Release APK was not produced."
            exit 1
          fi
          if [ -z "$RELEASE_AAB" ] || [ ! -s "$RELEASE_AAB" ]; then
            echo "::error::Signed Release AAB was not produced."
            exit 1
          fi

          STAGE_DIR="${RUNNER_TEMP}/shareflow-release-stage"
          mkdir -p "$STAGE_DIR"
          FIXED_APK="${STAGE_DIR}/Share-Flow.apk"
          cp -f "$RELEASE_APK" "$FIXED_APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          # 1. Verify APK cryptographic signature (v1/v2/v3)
          SIGNER_OUT=$("$APKSIGNER" verify --verbose --print-certs "$FIXED_APK")
          echo "$SIGNER_OUT"

          # Optional signing certificate pinning check (guarantees seamless upgrade compatibility)
          CERT_SHA256=$(printf '%s\n' "$SIGNER_OUT" | grep -i "Signer #1 certificate SHA-256 digest:" | head -n 1 | awk -F': ' '{print tolower($2)}' | tr -d '[:space:]')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Unable to extract APK signing certificate SHA-256 digest."
            exit 1
          fi
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            EXPECTED_NORM=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')
            if [ "$CERT_SHA256" != "$EXPECTED_NORM" ]; then
              echo "::error::Signing certificate SHA-256 mismatch! Aborting publish to protect user upgrades."
              exit 1
            fi
            echo "Verified signing certificate matches EXPECTED_CERT_SHA256."
          fi

          # 2. Verify 4-byte APK alignment (required for Android 11+ direct installation)
          "$ZIPALIGN" -c -v 4 "$FIXED_APK" >/dev/null
          echo "Verified Share-Flow.apk zipalign 4-byte alignment."

          # 3. Verify package identity, version metadata, and launchable activity via aapt2
          BADGING=$("$AAPT2" dump badging "$FIXED_APK")
          PKG_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          MIN_SDK=$(printf '%s\n' "$BADGING" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" | head -n 1)
          HAS_LAUNCHER=$(printf '%s\n' "$BADGING" | grep -c "^launchable-activity:" || true)

          if [ "$PKG_NAME" != "com.aistudio.shareflow.kxrvnm" ]; then
            echo "::error::Unexpected package name '$PKG_NAME'. Expected 'com.aistudio.shareflow.kxrvnm'."
            exit 1
          fi
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ] || [ "$HAS_LAUNCHER" -lt 1 ]; then
            echo "::error::APK badging validation failed (versionCode=$VERSION_CODE, versionName=$VERSION_NAME, launcher=$HAS_LAUNCHER)."
            exit 1
          fi

          # 4. Verify AAB signature
          AAB_ABS=$(realpath "$RELEASE_AAB")
          jarsigner -verify -strict "$AAB_ABS" >/dev/null

          # 5. Anti-downgrade guard against latest published version.json on TARGET_REPO (if any)
          PREV_MANIFEST="${STAGE_DIR}/prev-version.json"
          if gh release download --repo "$TARGET_REPO" --pattern "version.json" --output "$PREV_MANIFEST" >/dev/null 2>&1; then
            VERSION_CODE="$VERSION_CODE" PREV_MANIFEST="$PREV_MANIFEST" python3 - <<'PYEOF'
            import json, os, sys
            try:
                with open(os.environ["PREV_MANIFEST"], "r", encoding="utf-8") as f:
                    prev = json.load(f)
                prev_code = int(prev.get("versionCode", 0))
                new_code = int(os.environ["VERSION_CODE"])
                if new_code < prev_code:
                    print(f"::error::Version downgrade blocked: new versionCode ({new_code}) is lower than latest published versionCode ({prev_code}).")
                    sys.exit(1)
                print(f"Anti-downgrade check passed (new={new_code} >= previous={prev_code}).")
            except SystemExit:
                raise
            except Exception as exc:
                print(f"Skipping previous manifest comparison due to unreadable JSON: {exc}")
            PYEOF
            rm -f "$PREV_MANIFEST"
          fi

          # 6. Compute SHA-256 and exact byte size
          APK_SHA256=$(sha256sum "$FIXED_APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$FIXED_APK")
          printf '%s  Share-Flow.apk\n' "$APK_SHA256" > "${STAGE_DIR}/Share-Flow.apk.sha256"

          # 7. Determine immutable release tag (preserving all prior releases on both local and mirror repos)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            BASE_TAG="v${VERSION_NAME}"
            TAG_EXISTS=0
            if git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
              TAG_EXISTS=1
            elif gh release view "${BASE_TAG}" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              TAG_EXISTS=1
            fi

            if [ "$TAG_EXISTS" -eq 1 ]; then
              RELEASE_TAG="v${VERSION_NAME}-b${VERSION_CODE}.${GITHUB_RUN_NUMBER}"
            else
              RELEASE_TAG="${BASE_TAG}"
            fi
          fi

          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DIRECT_APK_URL="https://github.com/${TARGET_REPO}/releases/download/${RELEASE_TAG}/Share-Flow.apk"

          # 8. Generate and validate version.json for ShareFlow in-app Cloud Update & website
          VERSION_CODE="$VERSION_CODE" \
          VERSION_NAME="$VERSION_NAME" \
          DIRECT_APK_URL="$DIRECT_APK_URL" \
          APK_SHA256="$APK_SHA256" \
          APK_SIZE="$APK_SIZE" \
          MIN_SDK="${MIN_SDK:-24}" \
          PUBLISHED_AT="$PUBLISHED_AT" \
          RELEASE_TAG="$RELEASE_TAG" \
          CERT_SHA256="$CERT_SHA256" \
          STAGE_DIR="$STAGE_DIR" \
          python3 - <<'PYEOF'
          import json, os

          v_name = os.environ["VERSION_NAME"]
          v_code = int(os.environ["VERSION_CODE"])
          notes_ar = os.environ.get("INPUT_NOTES_AR", "").strip() or (
              f"إصدار رسمي موقّع وموثّق من تطبيق Share Flow (النسخة {v_name} - بناء {v_code}) جاهز للتثبيت المباشر."
          )
          notes_en = os.environ.get("INPUT_NOTES_EN", "").strip() or (
              f"Verified signed Share Flow Android release (v{v_name}, build {v_code}) ready for direct APK installation."
          )

          manifest = {
              "versionCode": v_code,
              "versionName": v_name,
              "apkDownloadUrl": os.environ["DIRECT_APK_URL"],
              "sha256": os.environ["APK_SHA256"],
              "fileSizeBytes": int(os.environ["APK_SIZE"]),
              "minSupportedAndroidSdk": int(os.environ.get("MIN_SDK", "24")),
              "mandatory": False,
              "releaseNotesAr": notes_ar,
              "releaseNotesEn": notes_en,
              "portalUrl": os.environ.get("PORTAL_URL", "https://ow7ab.github.io/Share-Flow/"),
              "publishedAt": os.environ["PUBLISHED_AT"],
              "releaseTag": os.environ["RELEASE_TAG"],
              "signingCertSha256": os.environ["CERT_SHA256"],
          }

          assert manifest["versionCode"] > 0
          assert len(manifest["sha256"]) == 64
          assert manifest["apkDownloadUrl"].startswith("https://")
          assert manifest["apkDownloadUrl"].endswith("/Share-Flow.apk")

          out_path = os.path.join(os.environ["STAGE_DIR"], "version.json")
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print("Generated and validated version.json successfully.")
          PYEOF

          echo "apk_path=${FIXED_APK}" >> "$GITHUB_OUTPUT"
          echo "sha_path=${STAGE_DIR}/Share-Flow.apk.sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_path=${STAGE_DIR}/version.json" >> "$GITHUB_OUTPUT"
          echo "aab_path=${AAB_ABS}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "target_repo=${TARGET_REPO}" >> "$GITHUB_OUTPUT"
          if [ -n "$MAPPING_TXT" ]; then
            echo "mapping_path=$(realpath "$MAPPING_TXT")" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish verified Share-Flow.apk directly to GitHub Releases (no ZIP)
        id: publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.verify_outputs.outputs.target_repo }}
          RELEASE_TAG: ${{ steps.verify_outputs.outputs.release_tag }}
          VERSION_NAME: ${{ steps.verify_outputs.outputs.version_name }}
          VERSION_CODE: ${{ steps.verify_outputs.outputs.version_code }}
          APK_SHA256: ${{ steps.verify_outputs.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.verify_outputs.outputs.apk_size }}
          CERT_SHA256: ${{ steps.verify_outputs.outputs.cert_sha256 }}
          PUBLISHED_AT: ${{ steps.verify_outputs.outputs.published_at }}
          APK_PATH: ${{ steps.verify_outputs.outputs.apk_path }}
          SHA_PATH: ${{ steps.verify_outputs.outputs.sha_path }}
          MANIFEST_PATH: ${{ steps.verify_outputs.outputs.manifest_path }}
        run: |
          set -euo pipefail

          SIZE_MB=$(APK_SIZE="$APK_SIZE" python3 -c "import os; print(f'{int(os.environ[\"APK_SIZE\"]) / (1024 * 1024):.2f} MB')")
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "$NOTES_FILE" << EOF
          ## Share Flow v${VERSION_NAME} (Build ${VERSION_CODE})

          ### التحميل المباشر لتطبيق أندرويد (APK)
          - **رابط التحميل المباشر (أحدث إصدار):** https://github.com/${TARGET_REPO}/releases/latest/download/Share-Flow.apk
          - **رابط هذا الإصدار:** https://github.com/${TARGET_REPO}/releases/download/${RELEASE_TAG}/Share-Flow.apk
          - **حجم الملف:** ${SIZE_MB} (${APK_SIZE} bytes)
          - **تاريخ النشر (UTC):** ${PUBLISHED_AT}
          - **بصمة التحقق (SHA-256):** \`${APK_SHA256}\`
          - **بصمة شهادة التوقيع (SHA-256):** \`${CERT_SHA256}\`

          > تم بناء التطبيق وتوقيعه بمفتاح الإصدار المعتمد والتحقق التلقائي من \`apksigner\` و\`zipalign\` و\`aapt2\` واجتياز اختبارات الوحدة قبل النشر.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading verified assets with clobber without deleting prior releases."
            gh release upload "$RELEASE_TAG" \
              "$APK_PATH#Share-Flow.apk" \
              "$SHA_PATH#Share-Flow.apk.sha256" \
              "$MANIFEST_PATH#version.json" \
              --repo "$TARGET_REPO" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$TARGET_REPO" \
              --title "Share Flow v${VERSION_NAME} (Build ${VERSION_CODE})" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            TARGET_ARGS=()
            if [ "$TARGET_REPO" = "${GITHUB_REPOSITORY}" ]; then
              TARGET_ARGS+=(--target "${GITHUB_SHA}")
            fi
            gh release create "$RELEASE_TAG" \
              "$APK_PATH#Share-Flow.apk" \
              "$SHA_PATH#Share-Flow.apk.sha256" \
              "$MANIFEST_PATH#version.json" \
              --repo "$TARGET_REPO" \
              "${TARGET_ARGS[@]}" \
              --title "Share Flow v${VERSION_NAME} (Build ${VERSION_CODE})" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

      - name: Verify published GitHub Release asset integrity and direct APK download URL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.verify_outputs.outputs.target_repo }}
          RELEASE_TAG: ${{ steps.verify_outputs.outputs.release_tag }}
          EXPECTED_SIZE: ${{ steps.verify_outputs.outputs.apk_size }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" --json tagName,url,assets)
          RELEASE_JSON="$RELEASE_JSON" python3 - <<'PYEOF'
          import json, os
          data = json.loads(os.environ["RELEASE_JSON"])
          assets = {a["name"]: a for a in data.get("assets", [])}
          assert "Share-Flow.apk" in assets, "Share-Flow.apk asset missing from published release!"
          assert "version.json" in assets, "version.json asset missing from published release!"
          assert not any(name.lower().endswith(".zip") for name in assets), "ZIP archive must not be published as release asset!"
          assert assets["Share-Flow.apk"]["size"] == int(os.environ["EXPECTED_SIZE"]), "Published APK size mismatch!"
          print("Verified published GitHub Release:", data["url"])
          print("Direct latest APK URL: https://github.com/" + os.environ["TARGET_REPO"] + "/releases/latest/download/Share-Flow.apk")
          PYEOF

          IS_PRIVATE=$(gh repo view "$TARGET_REPO" --json isPrivate --jq '.isPrivate' 2>/dev/null || echo "true")
          if [ "$IS_PRIVATE" = "false" ]; then
            LATEST_APK_URL="https://github.com/${TARGET_REPO}/releases/latest/download/Share-Flow.apk"
            HEADERS=$(curl -fsSLI --max-redirs 5 "$LATEST_APK_URL")
            CONTENT_TYPE=$(printf '%s\n' "$HEADERS" | grep -i "^content-type:" | tail -n 1 | tr '[:upper:]' '[:lower:]')
            CONTENT_LEN=$(printf '%s\n' "$HEADERS" | grep -i "^content-length:" | tail -n 1 | awk '{print $2}' | tr -d '\r')
            if printf '%s' "$CONTENT_TYPE" | grep -q "text/html"; then
              echo "::error::Direct APK URL returned HTML instead of binary APK ($CONTENT_TYPE)."
              exit 1
            fi
            if [ -n "$CONTENT_LEN" ] && [ "$CONTENT_LEN" != "$EXPECTED_SIZE" ]; then
              echo "::error::Direct APK URL Content-Length ($CONTENT_LEN) does not match expected APK size ($EXPECTED_SIZE)."
              exit 1
            fi
            echo "Verified direct latest APK download URL responds with binary APK (${CONTENT_LEN:-unknown} bytes)."
          else
            echo "Target repository ${TARGET_REPO} is private; skipped unauthenticated public URL probe."
          fi

      - name: Upload Release APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shareflow-release-apk
          path: ${{ steps.verify_outputs.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shareflow-release-aab
          path: ${{ steps.verify_outputs.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 ProGuard mapping file
        if: steps.verify_outputs.outputs.mapping_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: shareflow-release-r8-mapping
          path: ${{ steps.verify_outputs.outputs.mapping_path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Securely delete ephemeral keystore and staging files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/shareflow-release-key.jks"
          rm -f "${RUNNER_TEMP}/release-alias.init.gradle"
          rm -f "${RUNNER_TEMP}/debug-test-fallback.init.gradle"
          rm -f "${RUNNER_TEMP}/release-notes.md"
          rm -rf "${RUNNER_TEMP}/shareflow-release-stage"
