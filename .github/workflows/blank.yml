name: Android Debug APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build ShareFlow Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android Gradle project root
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find . -maxdepth 4 \
            \( -name ".git" -o -name ".gradle" -o -name "build" \) -prune -o \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print | sort | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not locate settings.gradle or settings.gradle.kts in repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Detected Android Gradle project root: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Gradle wrapper script (gradlew) not found in $PROJECT_DIR."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle wrapper JAR missing at $PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties missing at $PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper & configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Restore persistent CI debug keystore cache (fallback when secret is not set)
        uses: actions/cache@v4
        with:
          path: ~/.shareflow-ci-keystore
          key: shareflow-ci-debug-keystore-v1

      - name: Restore permanent project debug keystore for in-place APK updates
        id: prepare_debug_keystore
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          CACHE_DIR="${HOME}/.shareflow-ci-keystore"
          CACHED_KEYSTORE="${CACHE_DIR}/debug.keystore"
          KEYSTORE_SOURCE=""

          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            # Priority 1: Permanent GitHub Secret (never expires, never written to cache)
            printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "./debug.keystore"
            KEYSTORE_SOURCE="GitHub Secret (ANDROID_DEBUG_KEYSTORE_BASE64)"
          elif [ -s "./debug.keystore.base64" ]; then
            # Priority 2: Repository-bundled permanent debug.keystore.base64
            tr -d '\r\n' < "./debug.keystore.base64" | base64 --decode > "./debug.keystore"
            KEYSTORE_SOURCE="Repository file (debug.keystore.base64)"
          elif [ -s "$CACHED_KEYSTORE" ]; then
            # Priority 3: Persistent cached CI debug keystore across runs
            cp -f "$CACHED_KEYSTORE" "./debug.keystore"
            KEYSTORE_SOURCE="GitHub Actions persistent cache (shareflow-ci-debug-keystore-v1)"
            echo "::warning::Using cached CI debug keystore. For permanent non-expiring Debug APK updates (and exact parity with AI Studio builds), configure GitHub Secret ANDROID_DEBUG_KEYSTORE_BASE64."
          else
            # Priority 4: Generate one reusable standard Android debug keystore and cache it for subsequent runs
            mkdir -p "$CACHE_DIR"
            chmod 700 "$CACHE_DIR"
            keytool -genkeypair -v \
              -keystore "$CACHED_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            chmod 600 "$CACHED_KEYSTORE"
            cp -f "$CACHED_KEYSTORE" "./debug.keystore"
            KEYSTORE_SOURCE="Newly initialized cached CI debug keystore"
            echo "::warning::Initialized cached CI debug keystore because neither ANDROID_DEBUG_KEYSTORE_BASE64 nor debug.keystore.base64 was present. Set GitHub Secret ANDROID_DEBUG_KEYSTORE_BASE64 to prevent cache eviction from ever changing the debug certificate."
          fi

          chmod 600 "./debug.keystore"

          KEYSTORE_CERT_SHA256=$(keytool -list -v -keystore "./debug.keystore" -storepass android -alias androiddebugkey \
            | awk -F'SHA256: ' '/SHA256:/ {gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')

          if [ -z "$KEYSTORE_CERT_SHA256" ] || [ "${#KEYSTORE_CERT_SHA256}" -ne 64 ]; then
            echo "::error::Failed to verify androiddebugkey certificate inside debug keystore (${KEYSTORE_SOURCE})."
            exit 1
          fi

          echo "Keystore source: $KEYSTORE_SOURCE"
          echo "Verified debug signing certificate SHA-256: $KEYSTORE_CERT_SHA256"
          echo "expected_debug_cert_sha256=$KEYSTORE_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Build Android Debug APK (permanent project debugConfig signing)
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK signature continuity, alignment, and package metadata
        id: locate_apk
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          EXPECTED_DEBUG_CERT_SHA256: ${{ steps.prepare_debug_keystore.outputs.expected_debug_cert_sha256 }}
        run: |
          set -euo pipefail

          APK_FILE="./app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_FILE" ]; then
            APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | sort | head -n 1 || true)
          fi

          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::No non-empty APK was produced by assembleDebug."
            exit 1
          fi

          APK_ABS_PATH=$(realpath "$APK_FILE")
          APK_SIZE=$(stat -c%s "$APK_ABS_PATH")
          APK_SHA256=$(sha256sum "$APK_ABS_PATH" | awk '{print $1}')

          echo "Generated APK: $APK_ABS_PATH"
          echo "APK size (bytes): $APK_SIZE"
          echo "APK SHA-256: $APK_SHA256"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=""
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1 || true)
          fi

          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found to verify Debug APK signature."
            exit 1
          fi

          SIGNER_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_ABS_PATH")
          echo "$SIGNER_OUT"

          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNER_OUT" \
            | grep -Ei '^(Signer #[0-9]+|V[0-9.]+ Signer:)[[:space:]]+certificate SHA-256 digest:' \
            | head -n 1 \
            | sed -E 's/.*digest:[[:space:]]*//' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]:' || true)
          if [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "::error::Debug APK signing certificate mismatch! Expected ${EXPECTED_DEBUG_CERT_SHA256}, got ${ACTUAL_CERT_SHA256}. Aborting to preserve in-place updates."
            exit 1
          fi
          echo "Verified Debug APK signing certificate matches expected keystore (${ACTUAL_CERT_SHA256})."

          if [ -x "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -v 4 "$APK_ABS_PATH" >/dev/null
            echo "Verified 4-byte zipalign alignment."
          fi

          if [ -x "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK_ABS_PATH")
            PKG_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
            VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
            VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
            if [ "$PKG_NAME" != "com.aistudio.shareflow.kxrvnm" ]; then
              echo "::error::Unexpected package name '$PKG_NAME'. Expected 'com.aistudio.shareflow.kxrvnm'."
              exit 1
            fi
            echo "Verified package=${PKG_NAME} versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"
          fi

          echo "apk_path=$APK_ABS_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shareflow-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Clean up decoded debug keystore from runner workspace
        if: always()
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: rm -f "./debug.keystore"
