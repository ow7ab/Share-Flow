name: Generate Android Release Keystore (One-Time Setup)

on:
  workflow_dispatch:
    inputs:
      dname_cn:
        description: "Certificate Common Name (CN)"
        required: false
        default: "Share Flow"
        type: string
      dname_o:
        description: "Certificate Organization (O)"
        required: false
        default: "Share Flow"
        type: string
      dname_c:
        description: "Certificate 2-Letter Country Code (C, e.g. SD or US)"
        required: false
        default: "SD"
        type: string
      save_optional_release_pins:
        description: "Also save ANDROID_KEY_ALIAS (upload) and EXPECTED_CERT_SHA256 for release.yml pinning"
        required: false
        default: true
        type: boolean
      auto_delete_setup_token:
        description: "Automatically delete KEYSTORE_SETUP_TOKEN from Repository Secrets after saving keystore secrets (recommended)"
        required: false
        default: true
        type: boolean
      confirm_overwrite:
        description: "Safety guard: leave empty for first-time setup. Type OVERWRITE_EXISTING_KEYSTORE only if you intentionally want to replace an existing signing key."
        required: false
        default: ""
        type: string

concurrency:
  group: shareflow-generate-release-keystore
  cancel-in-progress: false

# Least privilege: built-in GITHUB_TOKEN cannot modify Actions Secrets by GitHub platform policy.
# Secret storage uses a short-lived Fine-grained PAT in secrets.KEYSTORE_SETUP_TOKEN scoped to this repository (Secrets: Read and write).
permissions:
  contents: read

jobs:
  generate-and-store-release-keystore:
    name: Generate Permanent shareflow-release.jks & Save Repository Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Validate secret-management token and prevent accidental keystore overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KEYSTORE_SETUP_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          CONFIRM_OVERWRITE: ${{ github.event.inputs.confirm_overwrite || '' }}
          DNAME_CN: ${{ github.event.inputs.dname_cn || 'Share Flow' }}
          DNAME_O: ${{ github.event.inputs.dname_o || 'Share Flow' }}
          DNAME_C: ${{ github.event.inputs.dname_c || 'SD' }}
        run: |
          set -euo pipefail

          # Sanitize KEYSTORE_SETUP_TOKEN against copy/paste whitespace, CR/LF, surrounding quotes, or Bearer/token prefix
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^["'"'"']+|["'"'"']+$//g; s/^(Bearer|token)[[:space:]]+//I')"
          export GH_TOKEN

          if [ -z "${GH_TOKEN:-}" ]; then
            {
              echo "## Action Required: Add Temporary \`KEYSTORE_SETUP_TOKEN\`"
              echo ""
              echo "GitHub Actions' built-in \`GITHUB_TOKEN\` **cannot** create or update Repository Actions Secrets by GitHub platform security policy."
              echo ""
              echo "### One-Time Setup Steps (2 minutes)"
              echo "1. Open **[New Fine-grained Personal Access Token](https://github.com/settings/personal-access-tokens/new)**."
              echo "2. Under **Repository access**, select **Only select repositories** -> \`${TARGET_REPO}\`."
              echo "3. Under **Repository permissions**, set **Secrets** to **Read and write** (Metadata: Read-only is auto-selected)."
              echo "4. Click **Generate token** and copy it."
              echo "5. Open **[Repository Actions Secrets](https://github.com/${TARGET_REPO}/settings/secrets/actions)** -> **New repository secret**:"
              echo "   - Name: \`KEYSTORE_SETUP_TOKEN\`"
              echo "   - Secret: *(paste the token)*"
              echo "6. Re-run this workflow once. After saving your permanent keystore secrets, revoke the temporary PAT."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing repository secret KEYSTORE_SETUP_TOKEN."
            echo "::error::GitHub Actions' built-in GITHUB_TOKEN is not permitted to create or update Repository Actions Secrets."
            echo "::error::Create a temporary Fine-grained Personal Access Token scoped ONLY to '${TARGET_REPO}' with permission 'Secrets: Read and write' (and 'Metadata: Read-only'), add it in Settings -> Secrets and variables -> Actions -> Repository secrets as KEYSTORE_SETUP_TOKEN, run this workflow once, and then revoke/delete KEYSTORE_SETUP_TOKEN."
            exit 1
          fi

          # Validate certificate DN inputs with Python (avoids POSIX grep bracket-escape bugs where \r\n matches literal 'r'/'n')
          python3 - <<'PYEOF'
          import os, re, sys

          cn = os.environ.get("DNAME_CN", "").strip()
          org = os.environ.get("DNAME_O", "").strip()
          country = os.environ.get("DNAME_C", "").strip()

          if not re.fullmatch(r"[A-Za-z]{2}", country):
              print(f"::error::Invalid 2-letter country code (dname_c): '{country}'. Expected 2 letters (e.g. SD, US).", file=sys.stderr)
              sys.exit(1)

          dn_pattern = re.compile(r"^[A-Za-z0-9 ._+-]{1,64}$")
          for label, value in [("dname_cn", cn), ("dname_o", org)]:
              if not dn_pattern.fullmatch(value):
                  print(
                      f"::error::Invalid {label} value: '{value}'. Use 1-64 characters from letters, digits, spaces, and ._+- only.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          PYEOF

          # Verify token has Actions Secrets access on the current repository
          if ! EXISTING_SECRETS=$(gh secret list --app actions --repo "$TARGET_REPO" --json name --jq '.[].name' 2>&1); then
            if printf '%s' "$EXISTING_SECRETS" | grep -Eqi '401|Bad credentials'; then
              echo "::error::KEYSTORE_SETUP_TOKEN was rejected by GitHub (HTTP 401: Bad credentials). The token is expired, revoked, or malformed."
              echo "::error::Generate a fresh Fine-grained PAT at https://github.com/settings/personal-access-tokens/new (Secrets: Read and write on ${TARGET_REPO}) and update KEYSTORE_SETUP_TOKEN."
            else
              echo "::error::KEYSTORE_SETUP_TOKEN does not have permission to access Actions Secrets on '${TARGET_REPO}': ${EXISTING_SECRETS}"
              echo "::error::Ensure the Fine-grained PAT grants 'Secrets: Read and write' on '${TARGET_REPO}'."
            fi
            exit 1
          fi

          FOUND_EXISTING=()
          for sec_name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if printf '%s\n' "$EXISTING_SECRETS" | grep -Fxq "$sec_name"; then
              FOUND_EXISTING+=("$sec_name")
            fi
          done

          if [ "${#FOUND_EXISTING[@]}" -gt 0 ] && [ "$CONFIRM_OVERWRITE" != "OVERWRITE_EXISTING_KEYSTORE" ]; then
            echo "::error::Refusing to overwrite existing production release signing secrets: ${FOUND_EXISTING[*]}."
            echo "::error::Replacing a signing key breaks in-place Android app upgrades for existing users."
            echo "::error::If you truly intend to replace them, re-run with confirm_overwrite set to OVERWRITE_EXISTING_KEYSTORE."
            exit 1
          fi

          echo "Pre-flight token check and overwrite safety guard passed for '${TARGET_REPO}'."

      - name: Set up JDK 17 (Temurin) for keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate shareflow-release.jks (RSA 2048, 10000 days, alias upload), verify with keytool, and save to Repository Secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KEYSTORE_SETUP_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          DNAME_CN: ${{ github.event.inputs.dname_cn || 'Share Flow' }}
          DNAME_O: ${{ github.event.inputs.dname_o || 'Share Flow' }}
          DNAME_C: ${{ github.event.inputs.dname_c || 'SD' }}
          SAVE_OPTIONAL_PINS: ${{ github.event.inputs.save_optional_release_pins }}
          AUTO_DELETE_SETUP_TOKEN: ${{ github.event.inputs.auto_delete_setup_token }}
        run: |
          set -euo pipefail
          umask 077

          # Sanitize KEYSTORE_SETUP_TOKEN against copy/paste whitespace, CR/LF, surrounding quotes, or Bearer/token prefix
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^["'"'"']+|["'"'"']+$//g; s/^(Bearer|token)[[:space:]]+//I')"
          export GH_TOKEN

          WORK_DIR="${RUNNER_TEMP}/shareflow-keystore-gen"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          chmod 700 "$WORK_DIR"

          KEYSTORE_PATH="${WORK_DIR}/shareflow-release.jks"
          KEYSTORE_B64_FILE="${WORK_DIR}/shareflow-release.jks.b64"
          ROUNDTRIP_JKS="${WORK_DIR}/roundtrip-verify.jks"
          KEY_ALIAS="upload"

          # Generate cryptographically strong, independent random passwords (32 alphanumeric chars each, no pipe SIGPIPE risk)
          STORE_PASSWORD=$(python3 -c 'import secrets, string; a = string.ascii_letters + string.digits; print("".join(secrets.choice(a) for _ in range(32)), end="")')
          KEY_PASSWORD=$(python3 -c 'import secrets, string; a = string.ascii_letters + string.digits; print("".join(secrets.choice(a) for _ in range(32)), end="")')

          if [ "${#STORE_PASSWORD}" -lt 24 ] || [ "${#KEY_PASSWORD}" -lt 24 ]; then
            echo "::error::Failed to generate sufficiently strong random keystore passwords."
            exit 1
          fi

          # Mask sensitive values immediately so GitHub Actions redacts them if anything ever touches output
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"

          export STORE_PASSWORD KEY_PASSWORD
          DNAME_UPPER_C=$(printf '%s' "$DNAME_C" | tr '[:lower:]' '[:upper:]')
          DNAME="CN=${DNAME_CN}, O=${DNAME_O}, C=${DNAME_UPPER_C}"

          # 1. Create JKS keystore using keytool with passwords passed strictly via environment variables
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "$DNAME" \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD >/dev/null 2>&1

          chmod 600 "$KEYSTORE_PATH"

          # 2. Encode keystore to single-line Base64 strictly on disk (never printed to stdout)
          base64 -w 0 "$KEYSTORE_PATH" > "$KEYSTORE_B64_FILE"
          chmod 600 "$KEYSTORE_B64_FILE"

          if [ ! -s "$KEYSTORE_B64_FILE" ]; then
            echo "::error::Encoded Base64 keystore file is empty."
            exit 1
          fi

          # 3. Verify Base64 round-trip integrity and keytool entry/validity/algorithm
          tr -d '\r\n' < "$KEYSTORE_B64_FILE" | base64 --decode > "$ROUNDTRIP_JKS"
          chmod 600 "$ROUNDTRIP_JKS"

          KEYTOOL_OUT=$(keytool -list -v \
            -keystore "$ROUNDTRIP_JKS" \
            -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS")

          if ! printf '%s\n' "$KEYTOOL_OUT" | grep -qi "Entry type: PrivateKeyEntry"; then
            echo "::error::Keystore verification failed: alias '${KEY_ALIAS}' is not a PrivateKeyEntry."
            exit 1
          fi

          if ! printf '%s\n' "$KEYTOOL_OUT" | grep -Eqi "2048-bit RSA"; then
            echo "::error::Keystore verification failed: expected 2048-bit RSA key."
            exit 1
          fi

          # Verify key password unlocks the private key independently (non-destructive export/verify check)
          keytool -list -keystore "$ROUNDTRIP_JKS" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          VERIFY_TMP_P12="${WORK_DIR}/verify-keypass.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$ROUNDTRIP_JKS" \
            -srcstoretype JKS \
            -srcalias "$KEY_ALIAS" \
            -srcstorepass:env STORE_PASSWORD \
            -srckeypass:env KEY_PASSWORD \
            -destkeystore "$VERIFY_TMP_P12" \
            -deststoretype PKCS12 \
            -deststorepass:env STORE_PASSWORD \
            -destkeypass:env KEY_PASSWORD >/dev/null 2>&1
          rm -f "$VERIFY_TMP_P12"

          CERT_SHA256=$(printf '%s\n' "$KEYTOOL_OUT" \
            | awk -F'SHA256: ' '/SHA256:/ {gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')
          VALID_UNTIL=$(printf '%s\n' "$KEYTOOL_OUT" | grep -m 1 "Valid from:" || true)

          if [ -z "$CERT_SHA256" ] || [ "${#CERT_SHA256}" -ne 64 ]; then
            echo "::error::Failed to extract 64-character certificate SHA-256 fingerprint during verification."
            exit 1
          fi

          # 4. Save secrets directly to current repository via stdin (never passed via CLI args or printed)
          gh secret set ANDROID_KEYSTORE_BASE64 --app actions --repo "$TARGET_REPO" < "$KEYSTORE_B64_FILE"
          printf '%s' "$STORE_PASSWORD" | gh secret set ANDROID_STORE_PASSWORD --app actions --repo "$TARGET_REPO"
          printf '%s' "$KEY_PASSWORD" | gh secret set ANDROID_KEY_PASSWORD --app actions --repo "$TARGET_REPO"

          REQUIRED_STORED=(ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD)
          STORED_NAMES="ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD"
          if [ "${SAVE_OPTIONAL_PINS}" = "true" ]; then
            printf '%s' "$KEY_ALIAS" | gh secret set ANDROID_KEY_ALIAS --app actions --repo "$TARGET_REPO"
            printf '%s' "$CERT_SHA256" | gh secret set EXPECTED_CERT_SHA256 --app actions --repo "$TARGET_REPO"
            REQUIRED_STORED+=(ANDROID_KEY_ALIAS EXPECTED_CERT_SHA256)
            STORED_NAMES="${STORED_NAMES}, ANDROID_KEY_ALIAS, EXPECTED_CERT_SHA256"
          fi

          # 5. Confirm all target secrets exist in Repository Secrets
          VERIFIED_SECRETS=$(gh secret list --app actions --repo "$TARGET_REPO" --json name --jq '.[].name')
          for sec_name in "${REQUIRED_STORED[@]}"; do
            if ! printf '%s\n' "$VERIFIED_SECRETS" | grep -Fxq "$sec_name"; then
              echo "::error::Post-save verification failed: secret '${sec_name}' was not found in '${TARGET_REPO}'."
              exit 1
            fi
          done

          SETUP_TOKEN_STATUS="Retained (please delete manually)"
          if [ "${AUTO_DELETE_SETUP_TOKEN}" = "true" ]; then
            if gh secret delete KEYSTORE_SETUP_TOKEN --app actions --repo "$TARGET_REPO" >/dev/null 2>&1; then
              SETUP_TOKEN_STATUS="Deleted automatically from Repository Secrets (still revoke the PAT in GitHub Developer Settings)"
            fi
          fi

          {
            echo "## Android Release Keystore Generated & Stored"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| **Keystore (Ephemeral)** | \`shareflow-release.jks\` (never committed) |"
            echo "| **Alias** | \`${KEY_ALIAS}\` |"
            echo "| **Key Algorithm & Validity** | RSA 2048-bit, 10000 days |"
            echo "| **Validity Window** | ${VALID_UNTIL} |"
            echo "| **Public Certificate SHA-256** | \`${CERT_SHA256}\` |"
            echo "| **Saved Repository Secrets** | \`${STORED_NAMES}\` |"
            echo "| **KEYSTORE_SETUP_TOKEN Cleanup** | ${SETUP_TOKEN_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Keystore generated, verified via keytool, and stored securely in Repository Secrets."
          echo "  - Keystore filename (ephemeral, never committed): shareflow-release.jks"
          echo "  - Alias: ${KEY_ALIAS}"
          echo "  - Algorithm: RSA 2048-bit (10000 days validity)"
          echo "  - ${VALID_UNTIL}"
          echo "  - Public Certificate SHA-256 Fingerprint: ${CERT_SHA256}"
          echo "  - Secrets updated in ${TARGET_REPO}: ${STORED_NAMES}"
          echo "  - KEYSTORE_SETUP_TOKEN status: ${SETUP_TOKEN_STATUS}"

      - name: Securely wipe temporary keystore and encoded files
        if: always()
        shell: bash
        run: |
          WORK_DIR="${RUNNER_TEMP}/shareflow-keystore-gen"
          if [ -d "$WORK_DIR" ]; then
            if command -v shred >/dev/null 2>&1; then
              find "$WORK_DIR" -type f -exec shred -u {} + 2>/dev/null || true
            fi
            rm -rf "$WORK_DIR"
          fi
