name: Validate & Deploy ShareFlow Website (Unified Repo)

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/sync-public-docs.sh"
      - "scripts/test-portal.js"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional manual verification note"
        required: false
        default: "Validate unified Share Flow website"

concurrency:
  group: shareflow-unified-website-validation
  cancel-in-progress: false

# Least privilege: read-only checkout; GitHub Pages deploys directly from ow7ab/Share-Flow (main -> /docs).
permissions:
  contents: read

jobs:
  validate-unified-website:
    name: Validate Unified Website in ow7ab/Share-Flow (/docs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unified repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run portal unit tests & security allowlist check
        shell: bash
        run: |
          set -euo pipefail
          node --test ./scripts/test-portal.js
          bash ./scripts/sync-public-docs.sh --dry-run

      - name: Clean temporary staging directory
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/shareflow-public-docs-sync"
