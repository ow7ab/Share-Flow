name: Validate & Deploy ShareFlow Website (Unified Repo)

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/sync-public-docs.sh"
      - "scripts/test-portal.js"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional manual verification note"
        required: false
        default: "Validate unified Share Flow website"

concurrency:
  group: shareflow-unified-website-validation
  cancel-in-progress: false

# Least privilege: read-only checkout; GitHub Pages deploys directly from ow7ab/Share-Flow (main -> /docs).
permissions:
  contents: read

jobs:
  validate-unified-website:
    name: Validate Unified Website in ow7ab/Share-Flow (/docs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unified repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run portal unit tests & security allowlist check
        shell: bash
        run: |
          set -euo pipefail
          node --test ./scripts/test-portal.js
          bash ./scripts/sync-public-docs.sh --dry-run
          bash ./scripts/deploy-plesk-ftps.sh --dry-run

      - name: Deploy verified static docs/ to Sudani Plesk (when configured)
        shell: bash
        env:
          PLESK_FTP_PASSWORD: ${{ secrets.PLESK_FTP_PASSWORD }}
          PLESK_FTP_HOST: ${{ vars.PLESK_FTP_HOST || '196.1.255.37' }}
          PLESK_FTP_USER: ${{ vars.PLESK_FTP_USER || 'ow7ab' }}
          PLESK_FTP_PORT: ${{ vars.PLESK_FTP_PORT || '21' }}
          PLESK_FTP_REMOTE_DIR: ${{ vars.PLESK_FTP_REMOTE_DIR || '/httpdocs' }}
          PLESK_FTP_SSL_FORCE: ${{ vars.PLESK_FTP_SSL_FORCE || 'true' }}
          PLESK_FTP_TLS_VERIFY: ${{ vars.PLESK_FTP_TLS_VERIFY || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$PLESK_FTP_PASSWORD" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends lftp
          fi
          bash ./scripts/deploy-plesk-ftps.sh --skip-if-unconfigured

      - name: Clean temporary staging directory
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/shareflow-public-docs-sync"
